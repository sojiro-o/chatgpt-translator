name: Build QuickTranslate

on:
  push:
    branches: [quicktranslate]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      DERIVED: ${{ github.workspace }}/build/DerivedData
      SPM_DIR: ${{ github.workspace }}/build/SourcePackages
      LOG_DIR: ${{ github.workspace }}/build/logs
      # Skip SwiftFormat/SwiftLint run-script phases and sign ad hoc (no Apple Developer account needed).
      COMMON_SETTINGS: >-
        EASYDICT_RELEASE_PACKAGING=YES
        CODE_SIGN_IDENTITY=-
        CODE_SIGN_STYLE=Manual
        DEVELOPMENT_TEAM=
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          mkdir -p "$LOG_DIR"
          echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Easydict.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build Release app
        run: |
          # shellcheck disable=SC2086
          xcodebuild build \
            -workspace Easydict.xcworkspace \
            -scheme Easydict \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            $COMMON_SETTINGS \
            > "$LOG_DIR/build.log" 2>&1 || {
              echo "::group::Compiler errors"
              grep -E '(error|fatal error):' "$LOG_DIR/build.log" | sort -u | head -200
              echo "::endgroup::"
              tail -80 "$LOG_DIR/build.log"
              exit 1
            }
          grep -E 'warning:.*(DoubleCopy|QuickTranslate)' "$LOG_DIR/build.log" | sort -u | head -50 || true
          tail -5 "$LOG_DIR/build.log"

      - name: Check app identity and privacy settings
        run: |
          APP="$DERIVED/Build/Products/Release/QuickTranslate.app"
          PLIST="$APP/Contents/Info.plist"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$PLIST"
          if /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$PLIST" 2>/dev/null; then
            echo "::error::SUFeedURL must not be set (update checks are disabled)"; exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" != "com.izual.Easydict"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$BUILD_NUMBER"
          codesign -dv "$APP" 2>&1 | head -5
          lipo -info "$APP/Contents/MacOS/QuickTranslate"

      - name: Package app
        run: |
          cd "$DERIVED/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent QuickTranslate.app "$GITHUB_WORKSPACE/QuickTranslate.zip"
          shasum -a 256 "$GITHUB_WORKSPACE/QuickTranslate.zip"

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: QuickTranslate-${{ github.sha }}
          path: QuickTranslate.zip
          retention-days: 14

      - name: Unit tests (double ⌘C detector)
        run: |
          # shellcheck disable=SC2086
          xcodebuild test \
            -workspace Easydict.xcworkspace \
            -scheme Easydict \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -only-testing:EasydictTests/DoubleCopyDetectorTests \
            $COMMON_SETTINGS \
            > "$LOG_DIR/test.log" 2>&1 || {
              echo "::group::Errors and failures"
              grep -a -E '(error|fatal error):|✘|failed|Failing tests' "$LOG_DIR/test.log" | sort -u | head -200
              echo "::endgroup::"
              tail -80 "$LOG_DIR/test.log"
              exit 1
            }
          # Swift Testing prints ✔/✘ lines; XCTest prints "Executed N tests".
          grep -a -E 'Test run with|✔|✘|Executed' "$LOG_DIR/test.log" | tail -40

      - name: Publish release
        if: github.ref == 'refs/heads/quicktranslate' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -f QuickTranslate.zip
          shasum -a 256 QuickTranslate.zip > QuickTranslate.zip.sha256
          cat QuickTranslate.zip.sha256

          TAG="build-$BUILD_NUMBER"
          TITLE="QuickTranslate (build $BUILD_NUMBER)"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            cat <<'EOF'
          ### インストール

          ```bash
          curl -fsSL https://raw.githubusercontent.com/sojiro-o/chatgpt-translator/quicktranslate/scripts/install.sh | bash
          ```

          ### 更新

          更新するときも同じコマンドを実行します。更新後は「システム設定 › プライバシーとセキュリティ › 入力監視」で QuickTranslate をもう一度オンにしてください。

          ### 署名について

          ad-hoc 署名のみ（Apple の公証なし）。
          EOF
          } > "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" QuickTranslate.zip QuickTranslate.zip.sha256 --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$TAG" QuickTranslate.zip QuickTranslate.zip.sha256 \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi

          OLD_TAGS="$(
            gh release list --limit 100 --json tagName \
              --jq '[.[].tagName | select(test("^build-[0-9]+$"))] | sort_by(ltrimstr("build-") | tonumber) | reverse | .[5:][]'
          )"
          if [ -n "$OLD_TAGS" ]; then
            while IFS= read -r old_tag; do
              [ -n "$old_tag" ] || continue
              gh release delete "$old_tag" --cleanup-tag --yes
            done <<< "$OLD_TAGS"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.sha }}
          path: build/logs
          retention-days: 7
